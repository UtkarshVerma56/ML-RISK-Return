name: CI - Test Before Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run unit tests
        run: python -m pytest tests/ -v

      - name: Verify API health end-to-end
        run: |
          touch serving/__init__.py
          nohup uvicorn serving.app:app --host 0.0.0.0 --port 8000 &
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          echo "✅ Health check passed"

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t return-risk-scorer:test .

      - name: Test Docker container runs
        run: |
          docker run -d -p 8000:8000 --name test-container return-risk-scorer:test
          sleep 15
          curl -f http://localhost:8000/health || exit 1
          echo "✅ Docker container health check passed"
          docker stop test-container
